<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>The Living Archive — A Digital Photobook</title><meta name="description" content="An interactive photographic and archival portfolio presented as a cinematic book."><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600&family=Playfair+Display:ital,wght@0,400;0,500;1,400&display=swap" rel="stylesheet"><style>
:root{--bg:#0c0e0e;--paper:#1a1c1b;--paper2:#20211f;--ink:#f1e9db;--dim:#a9a499;--accent:#b99a73;--line:#46433d}*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font-family:'DM Sans',sans-serif}body{background:radial-gradient(ellipse at 50% 38%,#292a27 0%,#111312 56%,#090a0a 100%)}button,a{font:inherit}button{cursor:pointer}a{color:inherit}.shell{min-height:100vh;display:flex;flex-direction:column;padding:22px clamp(14px,3vw,48px) 26px}.topbar,.bottombar{display:flex;align-items:center;justify-content:space-between;gap:14px}.topbar{padding-bottom:22px}.wordmark{font:20px 'Playfair Display',Georgia,serif;letter-spacing:.02em}.micro{font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:var(--dim)}.topbar a{text-decoration:none;color:var(--accent)}.stage{flex:1;display:flex;justify-content:center;align-items:center;perspective:2200px;min-height:570px}.book{width:min(1140px,100%);height:min(68vw,660px);min-height:520px;display:grid;grid-template-columns:1fr 1fr;position:relative;filter:drop-shadow(0 32px 32px #000a);transition:transform .5s ease}.book:before{content:'';position:absolute;inset:-9px -8px -9px -8px;border:1px solid #554b3c;border-radius:4px;pointer-events:none}.book:after{content:'';position:absolute;z-index:4;top:0;bottom:0;left:50%;width:20px;transform:translateX(-50%);background:linear-gradient(90deg,#0009,transparent 35%,#ffffff12 52%,#0009);pointer-events:none}.page{background:var(--paper);padding:clamp(26px,4vw,60px);position:relative;overflow:hidden;display:flex;flex-direction:column}.page.left{border-radius:3px 0 0 3px;box-shadow:inset -14px 0 24px #0004;background:linear-gradient(90deg,#242521,var(--paper) 14%,var(--paper) 94%,#131514)}.page.right{border-radius:0 3px 3px 0;box-shadow:inset 13px 0 22px #0003;background:linear-gradient(90deg,#111312,var(--paper) 6%,var(--paper) 94%,#252622)}.page.cover{background:linear-gradient(135deg,#202321,#101313 70%);border:1px solid #574b38}.page.cover:before{content:'';position:absolute;inset:18px;border:1px solid #6d5a4038;pointer-events:none}.page-number{position:absolute;bottom:23px;font-size:10px;letter-spacing:.18em;color:#9e9a90}.left .page-number{left:42px}.right .page-number{right:42px}.eyebrow{font-size:10px;letter-spacing:.23em;text-transform:uppercase;color:var(--accent)}h1,h2,h3,p{margin-top:0}h1,h2,h3{font-family:'Playfair Display',Georgia,serif;font-weight:400}h1{font-size:clamp(44px,5.7vw,88px);line-height:1.02;letter-spacing:-.045em}h2{font-size:clamp(30px,3.5vw,56px);line-height:1.13}h3{font-size:clamp(22px,2.4vw,38px)}p{line-height:1.8;color:#cbc5b8;font-size:clamp(12px,1.15vw,15px)}.muted{color:var(--dim)}.rule{height:1px;background:var(--line);margin:22px 0}.photo{width:100%;height:100%;object-fit:cover;filter:saturate(.6) contrast(1.07);background:#38352f}.photo-frame{flex:1;min-height:0;overflow:hidden;position:relative}.photo-frame:after{content:'';position:absolute;inset:0;box-shadow:inset 0 0 70px #0004;pointer-events:none}.caption{font-size:10px;letter-spacing:.08em;color:var(--dim);margin-top:14px;line-height:1.6}.folio{display:flex;justify-content:space-between;gap:12px;align-items:center;margin-top:auto;padding-top:20px}.folio span{font-size:10px;letter-spacing:.14em;color:var(--accent)}.contents{display:grid;gap:17px;margin-top:25px}.contents div{display:flex;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line);padding-bottom:12px}.contents span{font-size:11px;color:var(--dim)}.metadata{display:grid;grid-template-columns:1fr 1fr;gap:18px 20px;margin-top:20px}.metadata dt{font-size:9px;letter-spacing:.18em;text-transform:uppercase;color:var(--accent)}.metadata dd{margin:7px 0 0;font-size:12px;color:var(--ink)}.control{border:1px solid #605b52;background:#242622;color:var(--ink);border-radius:50%;height:42px;width:42px;display:grid;place-items:center;font-size:22px}.control:disabled{opacity:.28;cursor:default}.control:hover:not(:disabled){border-color:var(--accent);background:#34342e}.bottombar{max-width:1140px;width:100%;margin:0 auto;padding-top:20px}.controls{display:flex;align-items:center;gap:14px}.counter{min-width:100px;text-align:center;font-size:11px;letter-spacing:.13em;color:var(--dim)}.progress{height:2px;width:120px;background:#494840}.progress div{height:100%;background:var(--accent);transition:width .35s}.book.turn-next{animation:turnNext .42s ease}.book.turn-prev{animation:turnPrev .42s ease}@keyframes turnNext{0%{transform:rotateY(0)}45%{transform:rotateY(-4deg) scale(.992)}100%{transform:rotateY(0)}}@keyframes turnPrev{0%{transform:rotateY(0)}45%{transform:rotateY(4deg) scale(.992)}100%{transform:rotateY(0)}}.fade{animation:appear .45s ease}@keyframes appear{from{opacity:.3}to{opacity:1}}.cover-title{margin:auto 0;text-align:center}.cover-title h1{font-size:clamp(42px,5vw,78px)}.cover-title .eyebrow{margin-bottom:36px}.cover-title p{font-style:italic;font-family:Georgia,serif;font-size:17px}.cover-bottom{display:flex;justify-content:space-between;align-items:center}.small-link{color:var(--accent);font-size:11px;text-decoration:underline;text-underline-offset:4px}.note{font-size:11px;color:var(--dim);max-width:500px}.mobile-note{display:none}@media(max-width:720px){.shell{padding:16px 12px 22px}.topbar{padding-bottom:12px}.topbar .micro{display:none}.stage{min-height:560px}.book{height:550px;min-height:0;grid-template-columns:1fr;max-width:430px}.book:after{display:none}.page{padding:30px}.page.left{display:none}.page.right{border-radius:3px}.page-number{bottom:17px!important;right:25px!important}.mobile-note{display:block}.progress{width:75px}.bottombar .micro{display:none}h1{font-size:48px}h2{font-size:36px}p{font-size:13px}.caption{font-size:9px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important}}
</style></head><body><div class="shell"><header class="topbar"><div class="wordmark">The Living Archive</div><div class="micro">A visual collection · Volume 01 · 2026</div><a href="#" id="restart" class="micro">Return to cover ↗</a></header><main class="stage"><div id="book" class="book" aria-live="polite"><section id="left" class="page left"></section><section id="right" class="page right"></section></div></main><footer class="bottombar"><div class="note">A portfolio in chapters. <span class="mobile-note">Use the arrows to turn pages.</span><span class="micro">Use ← → to turn pages</span></div><div class="controls"><button id="prev" class="control" aria-label="Previous spread">‹</button><span id="counter" class="counter">01 / 06</span><button id="next" class="control" aria-label="Next spread">›</button><div class="progress"><div id="progress"></div></div></div></footer></div><script>
const img=(id,w=1100)=>`https://images.unsplash.com/${id}?auto=format&fit=crop&w=${w}&q=85`;
const photos={city:img('photo-1519501025264-65ba15a82390'),sky:img('photo-1519608487953-e999c86e7455'),notes:img('photo-1455390582262-044cdead277a'),pottery:img('photo-1565193566173-7a0ee3dbe261'),street:img('photo-1490312278390-ab64016e0aa9')};
const folio=(a,b)=>`<div class="folio"><span>${a}</span><span>${b}</span></div>`;
const image=(src,alt)=>`<div class="photo-frame"><img class="photo" src="${src}" alt="${alt}" loading="lazy"></div>`;
const spreads=[
[ `<div class="eyebrow">The Living Archive / Volume 01</div><div class="cover-title"><div class="eyebrow">Photography · Archives · Cultural Storytelling</div><h1>The Living<br><i>Archive</i></h1><p>Stories worth keeping.</p></div><div class="cover-bottom"><span class="eyebrow">A personal visual collection</span><span class="eyebrow">2026</span></div>`, `${image(photos.sky,'Moody twilight sky over an urban landscape')}<div class="caption">FRONTISPIECE · A study in atmosphere, place, and memory</div>${folio('THE LIVING ARCHIVE','01')}` ],
[ `<div class="eyebrow">Foreword / 01</div><h2 style="margin-top:38px">A note on<br><i>remembering.</i></h2><div class="rule"></div><p>Everyday life is full of small histories: objects held onto, familiar streets, gestures passed between generations, and places that quietly change.</p><p>This portfolio explores the relationship between photography, archives, and cultural memory. It is a space to observe, collect, and tell stories with care.</p>${folio('FOREWORD','02')}`, `<div class="eyebrow">Contents</div><h2 style="margin-top:25px">Collected<br><i>works.</i></h2><div class="contents"><div>01 &nbsp; Observations <span>Photography</span></div><div>02 &nbsp; Memory & Material <span>Archives</span></div><div>03 &nbsp; People & Place <span>Cultural storytelling</span></div><div>04 &nbsp; Objects of Memory <span>Sample collection</span></div><div>05 &nbsp; About / Contact <span>Colophon</span></div></div>${folio('CONTENTS','03')}` ],
[ `${image(photos.city,'Cinematic city buildings photographed at dusk')}<div class="caption">01 / OBSERVATIONS · Sample image for layout demonstration</div>${folio('PHOTOGRAPHY','04')}`, `<div class="eyebrow">Chapter I / Photography</div><h2 style="margin-top:38px">Observations</h2><p>Photographs of the overlooked: the familiar, the fleeting, the in-between. A visual practice attentive to light, space, and the emotional texture of ordinary places.</p><div class="rule"></div><p class="muted">Future collection: streetscapes, architecture, details, and personal photographic studies.</p>${folio('CHAPTER I','05')}` ],
[ `<div class="eyebrow">Chapter II / Archives</div><h2 style="margin-top:36px">Memory<br><i>& Material</i></h2><p>An archive is more than a place to store things. It is a way of asking what we choose to keep, how we describe it, and whose stories are made visible.</p><p>Future work will include digitized keepsakes, object histories, and carefully documented personal collections.</p>${folio('CHAPTER II','06')}`, `${image(photos.notes,'Notebook and handwritten materials, evocative of personal archives')}<div class="caption">02 / MEMORY & MATERIAL · Illustrative photograph</div>${folio('ARCHIVES','07')}` ],
[ `${image(photos.pottery,'Ceramic objects and pottery in a studio setting')}<div class="caption">03 / PEOPLE & PLACE · Illustrative photograph</div>${folio('CULTURAL STORYTELLING','08')}`, `<div class="eyebrow">Chapter III / Cultural Storytelling</div><h2 style="margin-top:38px">People<br><i>& Place</i></h2><p>Stories are held in shared practices, neighborhoods, and the places where people gather. This chapter will bring together documentary photographs, interviews, and contextual research.</p><div class="rule"></div><p class="muted">Proposed first photo essay: Clay & Community — exploring how ceramics connect creative practice and knowledge-sharing.</p>${folio('CHAPTER III','09')}` ],
[ `<div class="eyebrow">Collection study / 001</div><h2 style="margin-top:30px">Objects<br><i>of Memory</i></h2><p>A sample archival record demonstrating how a single object can be presented through both visual interpretation and structured description.</p><dl class="metadata"><div><dt>Object</dt><dd>Handmade ceramic vessel</dd></div><div><dt>Date</dt><dd>Undetermined</dd></div><div><dt>Material</dt><dd>Ceramic</dd></div><div><dt>Creator</dt><dd>Unidentified</dd></div><div><dt>Provenance</dt><dd>To be documented</dd></div><div><dt>Record status</dt><dd>Illustrative sample</dd></div></dl><div class="rule"></div><p class="muted">The final collection will use original photographs and verified descriptive information.</p>${folio('SAMPLE RECORD','10')}`, `${image(photos.pottery,'Illustrative pottery photograph for sample archival object record')}<div class="caption">OBJECT STUDY 001 · Sample photograph, not an identified collection item</div>${folio('OBJECTS OF MEMORY','11')}` ],
[ `<div class="eyebrow">Colophon / About</div><h2 style="margin-top:38px">Behind<br><i>the archive.</i></h2><p>I am interested in the ways photography, archives, and storytelling can preserve histories embedded in everyday life.</p><p>My work explores connections between people, places, objects, and cultural memory through visual documentation and research.</p><div class="rule"></div><p class="muted">This is a developing portfolio. Photographs currently shown are illustrative placeholders and will be replaced with original work.</p>${folio('ABOUT','12')}`, `<div class="eyebrow">Endmatter / Contact</div><h2 style="margin-top:38px">The story<br><i>continues.</i></h2><p>For conversations about photography, archives, documentary projects, and cultural storytelling.</p><div class="rule"></div><p class="muted">Add your professional email, résumé link, and social profiles here before publishing.</p><div style="margin-top:auto"><div class="eyebrow">The Living Archive</div><h3 style="margin:12px 0">Stories worth keeping.</h3><a class="small-link" href="#" id="endRestart">Return to the beginning ↗</a></div>${folio('COLOPHON','13')}` ]
];
let current=0;const left=document.getElementById('left'),right=document.getElementById('right'),book=document.getElementById('book');function render(dir=0){left.innerHTML=spreads[current][0];right.innerHTML=spreads[current][1];left.classList.toggle('cover',current===0);left.classList.add('fade');right.classList.add('fade');book.classList.remove('turn-next','turn-prev');void book.offsetWidth;if(dir)book.classList.add(dir>0?'turn-next':'turn-prev');document.getElementById('counter').textContent=String(current+1).padStart(2,'0')+' / '+String(spreads.length).padStart(2,'0');document.getElementById('progress').style.width=((current+1)/spreads.length*100)+'%';document.getElementById('prev').disabled=current===0;document.getElementById('next').disabled=current===spreads.length-1;document.getElementById('endRestart')?.addEventListener('click',e=>{e.preventDefault();current=0;render(-1)})}function go(d){const next=Math.max(0,Math.min(spreads.length-1,current+d));if(next!==current){current=next;render(d)}}document.getElementById('prev').onclick=()=>go(-1);document.getElementById('next').onclick=()=>go(1);document.getElementById('restart').onclick=e=>{e.preventDefault();current=0;render(-1)};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});render();
</script></body></html>
